---
name: "Gmail Parcels"
version: "1.0.4"
slug: "gmail_parcels"
description: "Track parcels from Gmail emails using AI"
url: "https://github.com/alex-savin/hassio-apps/gmail-parcels"
arch:
  - amd64
init: false
# Mount the shared folder (read-write) so the add-on can read the Gmail
# credentials/token files placed in /share (and refresh the OAuth token).
map:
  - share:rw
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Websocket and health endpoints (host port configurable)
options:
  log_level: info
  accounts: []
schema:
  log_level: "list(debug|info|warn|error)"
  accounts:
    - email: email
      credentials_file: str
      token_file: str
      project_id: str
      topic_name: str
      subscription_id: str
      carriers:
        - str
environment:
  WS_LISTEN_ADDR: ":8080"
image: "ghcr.io/alex-savin/gmail-parcels-addon-{arch}"
