---
name: "Gmail Parcels"
version: "1.2.0"
slug: "gmail_parcels"
description: "Track parcels from Gmail emails using AI"
url: "https://github.com/alex-savin/hassio-apps/gmail-parcels"
arch:
  - amd64
init: false
# Mount the shared folder (read-write) so the add-on can read the Gmail
# credentials/token files placed in /share (and refresh the OAuth token).
map:
  - share:rw
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Websocket and health endpoints (host port configurable)
options:
  log_level: info
  accounts: []
  fedex_api_key: ""
  fedex_secret_key: ""
  fedex_poll_minutes: 45
  fedex_sandbox: false
schema:
  log_level: "list(debug|info|warn|error)"
  accounts:
    - email: email
      credentials_file: str
      token_file: str
      project_id: str
      topic_name: str
      subscription_id: str
      carriers:
        - str
  # Optional: FedEx Track API enrichment (live status/ETA). See DOCS.
  fedex_api_key: "str?"
  fedex_secret_key: "password?"
  fedex_poll_minutes: "int(5,1440)?"
  fedex_sandbox: "bool?"
environment:
  WS_LISTEN_ADDR: ":8080"
# Web UI via Home Assistant Ingress (proxied + authenticated by HA; the add-on
# stays internal-only). Served on the same port as the API/WebSocket.
ingress: true
ingress_port: 8080
panel_icon: mdi:package-variant-closed
panel_title: Parcels
image: "ghcr.io/alex-savin/gmail-parcels-addon-{arch}"
