---
name: "Gmail Parcels"
version: "0.0.2"
stage: experrimental
slug: "gmail-parcels"
description: "Track parcels from Gmail emails using AI"
url: "https://github.com/alex-savin/go-gmail-parcels"
startup: application
boot: auto
init: false
arch:
  - amd64
options:
  accounts: []
schema:
  accounts:
    - email: email
      credentials_file: str
      token_file: str
      project_id: str
      topic_name: str
      subscription_id: str
      carriers:
        - str
ports:
  8080/tcp: 8080
image: "ghcr.io/alex-savin/gmail-parcels-addon-{arch}"
