---
name: Emporia Vue WebSocket
version: 0.0.1
slug: emporia_ws
description: WebSocket bridge for Emporia Vue using go-emporia-vue
url: https://github.com/alex-savin/hassio-apps/emporia-ws
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
schema:
  log_level: "list(debug|info|warn|error)"
options:
  log_level: info
ports:
  "8080/tcp": null
environment:
  ADDON_PORT: "8080"
image: "ghcr.io/alex-savin/emporia-ws-addon-{arch}"
