---
name: Emporia Vue Websocket
version: "1.1.0"
slug: emporia-vue-ws
description: >-
  Exposes Emporia Vue energy monitor data over websocket
  for Home Assistant integration.
arch:
  - amd64
  - aarch64
startup: services
init: false
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Websocket and health endpoints (host port configurable)
schema:
  log_level: "list(debug|info|warn|error)"
  poll_interval_seconds: int?
options:
  log_level: info
  poll_interval_seconds: 60
environment:
  WS_LISTEN_ADDR: ":8080"
image: "ghcr.io/alex-savin/{arch}-app-emporia-vue-ws"
