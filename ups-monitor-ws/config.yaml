---
name: UPS Monitor
version: 1.0.2
slug: ups_monitor
description: Expose UPS statuses via go-ups for Home Assistant
url: https://github.com/alex-savin/hassio-app-ups-monitor
arch:
  - aarch64
  - amd64
startup: services
init: false
map:
  - type: data
    read_only: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Websocket and health endpoints (host port configurable)
options:
  log_level: info
  poll_interval_seconds: 10
schema:
  log_level: "list(debug|info|warn|error)"
  poll_interval_seconds: int
environment:
  WS_LISTEN_ADDR: ":8080"
image: "ghcr.io/alex-savin/{arch}-app-ups-monitor"
