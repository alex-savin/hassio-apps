---
name: Xiaomi Home Websocket
version: "1.0.0"
slug: xiaomi-ws
description: >-
  Exposes Xiaomi Home (MIoT) robot-vacuum state and live maps over websocket
  for the companion Home Assistant integration.
arch:
  - amd64
  - aarch64
startup: services
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Websocket and health endpoints (host port configurable)
schema:
  log_level: "list(debug|info|warn|error)"
  poll_interval_seconds: int?
  map_poll_interval_seconds: int?
options:
  log_level: info
  poll_interval_seconds: 300
  map_poll_interval_seconds: 5
environment:
  WS_LISTEN_ADDR: ":8080"
image: "ghcr.io/alex-savin/{arch}-app-xiaomi-ws"
