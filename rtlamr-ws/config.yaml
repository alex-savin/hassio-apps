---
name: RTL-SDR (Software-Defined Radio) receiver for Automatic Meter Reading (AMR)
version: 0.0.1
slug: rtlamr_ws
panel_icon: mdi:gauge
description: RTL-SDR Automatic Meter Reading Bridge (Go)
startup: application
boot: auto
init: false
map:
  - config:rw
url: https://github.com/alex-savin/rtlamr-ws
uart: true
udev: true
usb: true
host_network: false
hassio_api: true
ports:
  8080/tcp: 8080
arch:
  - amd64
  - aarch64
healthcheck:
  cmd: "curl -f http://localhost:8080/health || exit 1"
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s
options:
  general:
    sleep_for: 60
    verbosity: info
    device_id: "0"
  custom_parameters: {}
  meters:
    - id: 22222222
      protocol: r900
      name: water
      format: "######.###"
      unit_of_measurement: "gal"
      device_class: water
      state_class: total_increasing

schema:
  general:
    sleep_for: "int?"
    verbosity: "list(debug|info|warning|critical|none)?"
    device_id: "str?"
    rtltcp_host: match(([\w\d\.]+):(\d+))?
  custom_parameters:
    rtltcp: "str?"
    rtlamr: "str?"
  meters:
    - id: int
      protocol: list(idm|netidm|r900|r900bcd|scm|scm+)
      name: "str"
      format: "str?"
      unit_of_measurement: "str?"
      icon: "str?"
      device_class: list(none|current|energy|gas|power|water)
      state_class: list(measurement|total|total_increasing)?
      expire_after: int?
      force_update: bool?
image: "ghcr.io/alex-savin/rtlamr-ws-addon-{arch}"