---
name: MySubaru Websocket
version: "1.0.2"
slug: mysubaru-ws
description: >-
  Exposes MySubaru vehicle state over websocket for Home Assistant integration.
arch:
  - amd64
  - aarch64
startup: services
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Websocket and health endpoints (host port configurable)
schema:
  log_level: "list(debug|info|warn|error)"
  poll_interval_seconds: int?
  location_poll_interval_seconds: int?
options:
  log_level: info
  poll_interval_seconds: 300
  location_poll_interval_seconds: 300
environment:
  WS_LISTEN_ADDR: ":8080"
image: "ghcr.io/alex-savin/{arch}-addon-mysubaru-ws"
