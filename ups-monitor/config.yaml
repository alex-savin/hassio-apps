---
name: UPS Monitor
version: 0.0.1
slug: ups-monitor
description: Expose UPS statuses via ups-monitor for Home Assistant
url: https://github.com/alex-savin/hassio-apps/ups-monitor
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: services
boot: auto
init: false
ingress: false
map:
  - data:rw
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: ups-monitor API
options:
  config_path: /data/config.yml
  log_level: info
  poll_interval_seconds: 10
  ws_listen_addr: :8080
schema:
  config_path: str
  log_level: "list(debug|info|warn|error)"
  poll_interval_seconds: int
  ws_listen_addr: str
image: "ghcr.io/alex-savin/ups-monitor-addon-{arch}"
