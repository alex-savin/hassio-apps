---
name: UPS Monitor
version: 0.0.1
slug: ups_monitor
description: Expose UPS statuses via go-ups for Home Assistant
url: https://github.com/example/go-ups
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: services
boot: auto
init: false
ingress: false
map:
  - data:rw
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: go-ups API
options:
  log_level: info
  poll_interval_seconds: 10
schema:
  log_level: "list(debug|info|warn|error)"
  poll_interval_seconds: int
image: "ghcr.io/alex-savin/ups-monitor-addon-{arch}"
